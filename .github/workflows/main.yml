name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP (if uploaded as ZIP)
        run: |
          ANDROID_ZIP=""
          while IFS= read -r z; do
            if unzip -l "$z" 2>/dev/null | grep -q "settings.gradle.kts"; then
              ANDROID_ZIP="$z"
              break
            fi
          done < <(find . -maxdepth 3 -type f -name "*.zip" 2>/dev/null)
          if [ -n "$ANDROID_ZIP" ]; then
            echo "Extracting Android project from $ANDROID_ZIP..."
            unzip -o "$ANDROID_ZIP" -d .extracted_android_tmp
            if [ -f ".extracted_android_tmp/settings.gradle.kts" ]; then
              cp -rf .extracted_android_tmp/. .
            else
              NESTED_DIR=$(dirname "$(find .extracted_android_tmp -maxdepth 3 -name "settings.gradle.kts" | head -n 1)")
              if [ -n "$NESTED_DIR" ] && [ -f "$NESTED_DIR/settings.gradle.kts" ]; then
                cp -rf "$NESTED_DIR"/. .
              fi
            fi
            rm -rf .extracted_android_tmp
          fi
          if [ ! -f "settings.gradle.kts" ] || [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Android project files (settings.gradle.kts / app/build.gradle.kts) not found! Please upload khaddo-stock-android-github.zip (NOT khaddo-stock-source-code.zip)."
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhaddoStock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
